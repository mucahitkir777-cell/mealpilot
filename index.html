 {id:'demo-bowl',title:'Hähnchen-Reis-Bowl',category:'Mittagessen',emoji:'🍛',servings:1,source:'',notes:'Reis trocken, Hähnchen und Gemüse roh wiegen.',steps:'1. Reis kochen, Hähnchen würzen und braten.\n2. Gemüse garen.\n3. Mit einem Kräuterdip aus Skyr servieren.',ingredients:[['Hähnchenbrust',150],['Reis (trocken)',50],['Brokkoli',150],['Zucchini',150],['Olivenöl',5],['Skyr',100]]},
 {id:'demo-kartoffel',title:'Kartoffeln mit Hähnchen',category:'Abendessen',emoji:'🥔',servings:1,source:'',notes:'Viel Volumen und gut zum Vorkochen.',steps:'1. Kartoffeln und Karotten mit Gewürzen im Ofen garen.\n2. Hähnchen separat garen.\n3. Skyr mit Kräutern als Dip verwenden.',ingredients:[['Kartoffeln',300],['Hähnchenbrust',200],['Karotten',250],['Skyr',100],['Olivenöl',5]]}
];
const copy= s=>JSON.parse(JSON.stringify(s));
function matchFood(str){let n=String(str||'').toLocaleLowerCase('de-DE').trim().replace(/[.,]$/,'');if(!n)return null;const exact=FOODS.find(f=>f.name.toLocaleLowerCase('de-DE')===n);if(exact)return exact;const alias=aliases[n];if(alias)return FOODS.find(f=>f.name===alias)||null;const long=FOODS.find(f=>n.includes(f.name.toLocaleLowerCase('de-DE')) && f.name.length>3);if(long)return long;const al=Object.keys(aliases).sort((a,b)=>b.length-a.length).find(a=>n.includes(a)&&a.length>3);return al?FOODS.find(f=>f.name===aliases[al]):null;}
function ingredient(name,grams,manual){const f=manual||matchFood(name);return {name:f?f.name:String(name||'Unbekannte Zutat'),grams:Number(grams)||0,values:f?{kcal:f.kcal,p:f.p,c:f.c,f:f.f,fi:f.fi}:null};}
function seedRecipe(r){return {...r,ingredients:r.ingredients.map(([name,grams])=>ingredient(name,grams))}}
function load(){try{const v=JSON.parse(localStorage.getItem(STORAGE));if(v&&Array.isArray(v.recipes)&&Array.isArray(v.meals))return v}catch(e){}return {recipes:initialRecipes.map(seedRecipe),meals:[],target:2000}};
let state=load();let view='home',q='',category='Alle',planDate=today(),editDraft=null,modal='',editId=null,importText='',importLink='';
const icons={home:'⌂',recipes:'▤',plan:'▦',settings:'⚙'};
const routes=[['home','Übersicht'],['recipes','Rezepte'],['plan','Tagesplan'],['settings','Einstellungen']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round((Number(n)||0)).toLocaleString('de-DE');
const f1=n=>Math.round((Number(n)||0)*10)/10;
const foodIcon=r=>r.emoji||({Frühstück:'🥣',Mittagessen:'🥗',Abendessen:'🍲',Snack:'🍓',Dessert:'🍰'}[r.category]||'🍽️');
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){toast('Speicher nicht verfügbar – bitte JSON exportieren.')}}
function totals(r){const sum={kcal:0,p:0,c:0,f:0,fi:0,unknown:0};(r.ingredients||[]).forEach(i=>{if(!i.values||!(Number(i.grams)>0)){sum.unknown++;return}['kcal','p','c','f','fi'].forEach(k=>sum[k]+=(Number(i.values[k])||0)*(Number(i.grams)||0)/100)});return sum}
function per(r){const t=totals(r),s=Math.max(1,Number(r.servings)||1);return Object.fromEntries(Object.entries(t).map(([k,v])=>[k,k==='unknown'?v:v/s]));}
function dayMeals(){return state.meals.filter(m=>m.date===planDate)}
function dayTotals(){let out={kcal:0,p:0,c:0,f:0,fi:0,unknown:0};dayMeals().forEach(m=>{const t=per(m.snapshot);Object.keys(out).forEach(k=>out[k]+=t[k]*(k==='unknown'?1:Number(m.portions||1)))});return out}
const safeUrl=u=>{try{const v=new URL(u);return ['http:','https:'].includes(v.protocol)?v.href:''}catch(e){return ''}};
function nav(){document.getElementById('sidebar-nav').innerHTML=routes.map(([v,label])=>`<button class="navbtn ${view===v?'active':''}" data-action="navigate" data-view="${v}"><span style="font-size:21px;min-width:25px;text-align:center">${icons[v]}</span>${label}</button>`).join('');document.getElementById('mobile-nav').innerHTML=routes.map(([v,label])=>`<button class="${view===v?'active':''}" data-action="navigate" data-view="${v}"><span>${icons[v]}</span>${label}</button>`).join('')}
function head(title,eyebrow,buttons=''){return `<div class="top"><div><div class="eyebrow">${eyebrow}</div><h1 class="heading">${title}</h1></div><div class="actions">${buttons}</div></div>`}
function stats(){const t=dayTotals(),left=state.target-t.kcal,percent=Math.min(100,Math.max(0,t.kcal/state.target*100));return `<div class="card padded"><div class="datepanel"><div><div class="eyebrow" style="margin-bottom:7px">DEIN TAGESZIEL</div><h2 style="font-size:25px;letter-spacing:-1px;margin:0">${fmt(t.kcal)} <span class="muted" style="font-weight:500;font-size:17px">/ ${fmt(state.target)} kcal</span></h2></div><button class="btn smallbtn" data-action="navigate" data-view="plan">Tagesplan ansehen →</button></div><div class="bar" style="margin:19px 0 10px"><div class="fill ${left<0?'over':''}" style="width:${percent}%"></div></div><div class="datepanel small"><span class="muted">${dayMeals().length} Mahlzeiten eingetragen</span><strong style="color:${left<0?'#a54a35':'#127653'}">${left>=0?fmt(left)+' kcal übrig':fmt(Math.abs(left))+' kcal über Ziel'}</strong></div><div class="stats" style="margin-top:20px"><div class="metric"><div class="lab">Protein</div><div class="num">${fmt(t.p)} <span class="unit">g</span></div></div><div class="metric"><div class="lab">Kohlenhydrate</div><div class="num">${fmt(t.c)} <span class="unit">g</span></div></div><div class="metric"><div class="lab">Fett</div><div class="num">${fmt(t.f)} <span class="unit">g</span></div></div></div>${t.unknown?'<p class="warning" style="margin-bottom:0">Mindestens ein Rezept enthält ungeklärte Zutaten. Tageswerte sind unvollständig.</p>':''}</div>`}
function recipeCard(r){const t=per(r);return `<article class="card recipecard"><div class="pic" aria-hidden="true">${recipeArt(r)}</div><div class="recipebody"><span class="chip">${esc(r.category||'Rezept')}</span><h3>${esc(r.title)}</h3><div class="meta">${fmt(t.p)} g Protein · ${fmt(t.c)} g KH${t.unknown?' · ⚠ Unvollständig':''}</div><div class="bottom"><div><strong>${t.unknown?'ab '+fmt(t.kcal):fmt(t.kcal)} kcal</strong><div class="muted" style="font-size:10px;margin-top:3px">pro Portion</div></div><button class="btn smallbtn light" data-action="detail" data-id="${esc(r.id)}">Ansehen →</button></div></div></article>`}
function home(){
 const recent=state.recipes.slice(-6).reverse();
 return head('Deine Küche. Deine Rezepte.','WILLKOMMEN BEI MEALPILOT',`<button class="btn primary" data-action="import">＋ Rezept importieren</button>`)+
 `<div class="card home-import-card"><div><strong>🍊 Ein Rezept entdeckt?</strong><p>Einfach den TikTok-Link einfügen. Wir übernehmen die Zutaten und Schritte.</p></div><button class="btn primary" data-action="import">Link einfügen →</button></div>`+
 `<div style="margin-top:18px">${stats()}</div>`+
 `<div class="sectionhead"><h2>Dein Rezeptbuch</h2><button class="btn smallbtn" data-action="navigate" data-view="recipes">Alle Rezepte →</button></div>`+
 `<div class="recipes">${recent.map(recipeCard).join('')}</div>`
}
function recipes(){const categories=['Alle',...new Set(state.recipes.map(r=>r.category).filter(Boolean))];const matches=state.recipes.filter(r=>(category==='Alle'||r.category===category)&&(`${r.title} ${r.ingredients.map(i=>i.name).join(' ')}`).toLowerCase().includes(q.toLowerCase()));return head('Mein Rezeptbuch','SAMMLUNG',`<button class="btn" data-action="new">+ Eigenes Rezept</button><button class="btn primary" data-action="import">↗ Importieren</button>`)+`<div class="toolrow"><input class="search" type="search" id="search" placeholder="🔎  Rezepte oder Zutaten suchen" value="${esc(q)}" />${categories.map(c=>`<button class="pill ${c===category?'active':''}" data-action="filter" data-category="${esc(c)}">${esc(c)}</button>`).join('')}</div>${matches.length?`<div class="recipes">${matches.map(recipeCard).join('')}</div>`:`<div class="empty"><div style="font-size:38px">🍽️</div><strong>Noch kein passendes Rezept</strong>Ändere die Suche oder lege ein neues Rezept an.</div>`}`}
function plan(){const t=dayTotals(),meals=['Frühstück','Mittagessen','Abendessen','Snack'];const titles={Frühstück:'🌤️',Mittagessen:'☀️',Abendessen:'🌙',Snack:'🍎'};return head('Dein Tagesplan','MAHLZEITEN & KALORIEN',`<button class="btn primary" data-action="addMeal">+ Mahlzeit hinzufügen</button>`)+`<div class="card padded"><div class="datepanel"><strong>Tag auswählen</strong><input type="date" id="planDate" value="${esc(planDate)}" /></div></div><div style="margin-top:15px">${stats()}</div>${meals.map(type=>`<div class="card padded mealgroup"><h3>${titles[type]} ${type}<button class="btn smallbtn light" data-action="addMeal" data-type="${type}">+ Hinzufügen</button></h3>${dayMeals().filter(m=>m.type===type).map(m=>{const t=per(m.snapshot);return `<div class="mealentry"><div class="symbol">${foodIcon(m.snapshot)}</div><div class="detail"><b>${esc(m.snapshot.title)}</b><div>${f1(m.portions)} ${m.portions===1?'Portion':'Portionen'} · ${fmt(t.p*m.portions)} g Protein</div></div><strong style="font-size:13px">${t.unknown?'ab ':''}${fmt(t.kcal*m.portions)} kcal</strong><button class="xbtn" data-action="removeMeal" data-id="${esc(m.id)}" title="Entfernen">✕</button></div>`}).join('')||'<div class="hint" style="padding:10px 0">Hier ist noch nichts geplant.</div>'}</div>`).join('')}${t.unknown?'<div class="warning" style="margin-top:12px">Achtung: Einige Rezepte enthalten Zutaten ohne ermittelte Nährwerte. Die Bilanz ist deshalb nur eine Untergrenze.</div>':''}`}
function settings(){return head('Einstellungen & Daten','DEIN MEALPILOT')+`<div class="settingsinfo"><div class="card padded"><h3 style="margin-top:0">Dein Kalorienziel</h3><p class="hint">Passe das tägliche Budget nach Bedarf an. 2.000 kcal sind ein persönlicher Richtwert, keine medizinisch berechnete Vorgabe.</p><div class="field"><label for="target">Kalorien pro Tag</label><input type="number" min="800" max="6000" step="50" id="target" value="${state.target}" /></div><button class="btn primary" data-action="saveTarget">Ziel speichern</button></div><div class="card padded"><h3 style="margin-top:0">Daten sichern</h3><p class="hint">Deine Daten liegen lokal in diesem Browser. Exportiere regelmäßig eine Sicherung. Für einen Gerätewechsel oder zum Weitergeben kannst du die JSON-Datei importieren.</p><div class="actions"><button class="btn primary" data-action="export">↧ Alles exportieren</button><button class="btn" data-action="importFile">↥ JSON importieren</button></div><input id="fileInput" type="file" accept=".json,application/json" style="display:none" /></div><div class="card padded"><h3 style="margin-top:0">Datenbasis</h3><p class="hint">In dieser Demo verwenden wir eine kleine lokale Lebensmittelliste mit ungefähren Nährwerten je 100 g. Markenprodukte und Zubereitung können davon abweichen. Zutaten ohne Treffer sind markiert. Eine verifizierte Nährwertdatenbank ist der nächste Ausbauschritt.</p><div class="small muted">${FOODS.length} hinterlegte Lebensmittel · ${state.recipes.length} Rezepte</div></div><div class="card padded"><h3 style="margin-top:0">Datenschutz und Kosten</h3><p class="hint">Deine Rezepte liegen lokal in deinem Browser. Der Import liest zunächst frei verfügbare Beschreibungstexte und Rezeptseiten. Nur bei Bedarf werden Anfragen und ggf. Videos an Gemini (Google) übertragen. Dabei können API-Kosten entstehen. Online-Mehrbenutzerkonten sind noch nicht eingerichtet.</p></div></div>`}
function render(){nav();document.getElementById('app').innerHTML=({home,recipes,plan,settings}[view]||home)(); if(view==='recipes'){const el=document.getElementById('search');el?.addEventListener('input',e=>{q=e.target.value;const pos=el.selectionStart;render();const n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos)})} if(view==='plan'){document.getElementById('planDate')?.addEventListener('change',e=>{planDate=e.target.value||today();render()})}}
let toastTimeout;function toast(message){const el=document.getElementById('toast');el.textContent=message;el.style.display='block';clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>{el.style.display='none'},3000)}
const modalRoot=()=>document.getElementById('modal-root');function showModal(content){modalRoot().innerHTML=`<div class="modalback" data-action="closeBackdrop"><div class="modal" role="dialog" aria-modal="true">${content}</div></div>`;const first=modalRoot().querySelector('input:not([type="hidden"]),textarea,button');first?.focus()};function closeModal(){modalRoot().innerHTML='';modal='';editDraft=null}
const topModal=(title,description='')=>`<div class="modaltop"><div><h2>${title}</h2>${description?`<p class="hint" style="margin:5px 0 0">${description}</p>`:''}</div><button class="modalclose" data-action="close" aria-label="Schließen">×</button></div>`;
function importModal(){modal='import';showModal(
  '<div class="modaltop"><div></div><button class="modalclose" data-action="close" aria-label="Schließen">×</button></div>'+
  '<div class="import-hero"><div class="import-art">🥘</div><h2 class="import-heading">Dein Rezept. Ein Link.</h2>'+
  '<p class="import-sub">TikTok-Link einfügen – MealPilot übernimmt das Rezept automatisch in dein Kochbuch.</p></div>'+
  '<div class="field"><label for="importLink">Rezeptlink</label><input type="url" class="import-link" id="importLink" placeholder="TikTok-Link hier einfügen" value="'+esc(importLink)+'" autocomplete="url"></div>'+
  '<div id="importStatus" class="import-status" role="status" aria-live="polite"></div>'+
  '<div class="modalactions"><button class="btn primary import-btn" data-action="analyzeVideo">Rezept importieren →</button></div>'+
  '<div class="import-note">Wir prüfen erst die Beschreibung. Nur falls nötig, wird das Video mit KI analysiert.</div>'+
  '<div id="manual-fallback"></div>');}
function showImportFallback(){
  const root=document.getElementById('manual-fallback');
  if(!root||root.children.length)return;
  root.innerHTML='<div class="field" style="margin-top:14px"><label for="importText">Alternativ: Rezepttext einfügen</label>'+
    '<textarea id="importText" style="min-height:115px" placeholder="Zutaten und Mengen aus dem Post kopieren"></textarea></div>'+
    '<button class="btn light" data-action="processImport" style="width:100%">Text übernehmen</button>';
}
function parseText(txt){let out=[],lines=txt.split(/[\n;,]+/); for(const line of lines){const re=/(\d+(?:[.,]\d+)?)\s*(kg|g|ml|l|el|tl|stück|stk)?\s+([^\d\n]+)/gi;let m;while((m=re.exec(line))!==null){let val=Number(m[1].replace(',','.')),unit=(m[2]||'g').toLowerCase(),name=m[3].trim().replace(/^(?:von|an|x|à)\s+/i,'').replace(/[.\-–:]$/,'').trim();if(name.length<2||name.length>90)continue;if(name.toLowerCase().startsWith('kcal'))continue;if(unit==='kg'||unit==='l')val*=1000;else if(unit==='el')val*=15;else if(unit==='tl')val*=5;else if(unit==='stück'||unit==='stk'){val*=(matchFood(name)?.name==='Ei'?58:matchFood(name)?.name==='Banane'?120:100)}out.push(ingredient(name,val));}}
return out.filter(i=>i.grams>0).slice(0,60)}
function beginEditor(recipe){editDraft=recipe?copy(recipe):{id:cryptoId(),title:'',category:'Mittagessen',emoji:'',servings:1,source:'',notes:'',steps:'',ingredients:[ingredient('Haferflocken',50)]};editId=recipe?.id||null;modal='edit';editorModal()}
function cryptoId(){return 'm-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function editorModal(){const r=editDraft;const sum=per(r);showModal(topModal(editId?'Rezept bearbeiten':'Neues Rezept','Alle Zutatengewichte möglichst im Rohzustand erfassen.')+`<div class="formrow"><div class="field"><label>Rezeptname *</label><input id="rTitle" value="${esc(r.title)}" placeholder="z. B. Protein-Porridge" /></div><div class="field"><label>Kategorie</label><select id="rCategory">${['Frühstück','Mittagessen','Abendessen','Snack','Dessert','Sonstiges'].map(x=>`<option ${r.category===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="formrow"><div class="field"><label>Portionen insgesamt</label><input id="rServings" type="number" step="1" min="1" max="99" value="${r.servings}" /></div><div class="field"><label>Rezeptlink (optional)</label><input id="rSource" type="url" value="${esc(r.source)}" placeholder="https://..." /></div></div><h3 style="font-size:15px;margin-bottom:7px">Zutaten & Mengen</h3><div class="hint" style="margin-bottom:11px">Gewicht in g (auch Flüssigkeiten vereinfacht in g). Namen aus der hinterlegten Liste werden automatisch erkannt.</div><div class="ingredients-head"><div>Lebensmittel</div><div>Gramm</div><div></div></div><div id="ingredient-editor">${ingredientInputs(r)}</div><button class="btn light smallbtn" data-action="addIngredient">+ Zutat hinzufügen</button><div id="nutrition-preview">${nutritionPreview(r)}</div><datalist id="foods">${FOODS.map(f=>`<option value="${esc(f.name)}">`).join('')}</datalist><div class="field" style="margin-top:14px"><label>Zubereitung</label><textarea id="rSteps" placeholder="Schritt für Schritt ...">${esc(r.steps)}</textarea></div><div class="field"><label>Notizen</label><textarea id="rNotes" placeholder="Hinweise, Tipps, Quellenangaben ...">${esc(r.notes)}</textarea></div><div class="modalactions"><button class="btn" data-action="close">Abbrechen</button><button class="btn primary" data-action="saveRecipe">Rezept speichern</button></div>`)}
function ingredientInputs(r){return r.ingredients.map((i,idx)=>`<div class="ingredient-row"><input list="foods" data-ingname="${idx}" value="${esc(i.name)}" placeholder="Lebensmittel" aria-label="Zutat ${idx+1}"/><input type="number" min="0" max="100000" step="1" data-inggrams="${idx}" value="${i.grams}" aria-label="Gramm ${idx+1}" /><button type="button" class="xbtn" data-action="removeIngredient" data-index="${idx}" title="Zutat entfernen">×</button></div>${i.grams<=0?`<div class="ingredient-warning">⚠ Menge fehlt – bitte Grammzahl ergänzen, sonst kann das Rezept nicht gespeichert werden.</div>`:""}${!i.values?`<div class="ingredient-warning" id="iw-${idx}">⚠ Keine Nährwerte gefunden. Bitte Lebensmittel prüfen.</div>`:''}`).join('')}
function nutritionPreview(r){const x=per(r);return `<div class="nutritionbox"><div class="nutri"><strong>${x.unknown?'≥ ':''}${fmt(x.kcal)}</strong><span>kcal / Portion</span></div><div class="nutri"><strong>${fmt(x.p)} g</strong><span>Protein</span></div><div class="nutri"><strong>${fmt(x.c)} g</strong><span>Kohlenhydrate</span></div><div class="nutri"><strong>${fmt(x.f)} g</strong><span>Fett</span></div></div>${x.unknown?`<p class="warning">${x.unknown} Zutat(en) ohne Datenbanktreffer. Angezeigte Nährwerte sind unvollständig; das Rezept wird entsprechend markiert.</p>`:''}`}
function grabEditor(){if(!editDraft)return;for(const [id,k] of [['rTitle','title'],['rCategory','category'],['rSource','source'],['rSteps','steps'],['rNotes','notes']]){const e=document.getElementById(id);if(e)editDraft[k]=e.value.trim()}const ss=document.getElementById('rServings');if(ss)editDraft.servings=Number(ss.value)||1;editDraft.ingredients.forEach((i,idx)=>{const n=document.querySelector(`[data-ingname="${idx}"]`),g=document.querySelector(`[data-inggrams="${idx}"]`);if(n){const newName=n.value.trim();if(newName!==i.name){const found=matchFood(newName);i.name=found?.name||newName;i.values=found?{kcal:found.kcal,p:found.p,c:found.c,f:found.f,fi:found.fi}:null}}if(g)i.grams=Number(g.value)||0})}
function refreshEditor(){grabEditor();const el=document.getElementById('ingredient-editor');if(el)el.innerHTML=ingredientInputs(editDraft);const p=document.getElementById('nutrition-preview');if(p)p.innerHTML=nutritionPreview(editDraft)}
function detail(id){const r=state.recipes.find(x=>x.id===id);if(!r)return;modal='detail';const x=per(r);showModal(topModal(esc(r.title),`${esc(r.category)} · ${r.servings} Portion(en) pro Rezept`)+`<div class="detailimage">${recipeArt(r)}</div>${nutritionPreview(r)}<div class="detailsgrid" style="margin-top:18px"><div><h3 style="font-size:15px;margin:0 0 10px">Zutaten (Gesamtrezept)</h3><ul class="inglist">${r.ingredients.map(i=>`<li><span>${esc(i.name)} ${!i.values?'⚠':''}</span><span>${fmt(i.grams)} g</span></li>`).join('')}</ul></div><div><h3 style="font-size:15px;margin:0 0 10px">Zubereitung</h3><div class="steps">${esc(r.steps||'Noch keine Anleitung hinterlegt.')}</div>${r.notes?`<h3 style="font-size:13px;margin-top:18px">Notizen</h3><p class="hint">${esc(r.notes)}</p>`:''}</div></div>${safeUrl(r.source)?`<p class="hint" style="margin-top:15px">Quelle: <a href="${esc(safeUrl(r.source))}" target="_blank" rel="noopener noreferrer">Originalrezept öffnen ↗</a></p>`:''}<div class="modalactions" style="justify-content:space-between"><button class="btn danger smallbtn" data-action="deleteRecipe" data-id="${esc(id)}">Löschen</button><div class="actions"><button class="btn smallbtn" data-action="exportSingle" data-id="${esc(id)}">↧ Export</button><button class="btn smallbtn" data-action="editRecipe" data-id="${esc(id)}">Bearbeiten</button><button class="btn primary smallbtn" data-action="addMeal" data-id="${esc(id)}">+ Zum Tagesplan</button></div></div>`)}
function addMealModal(id,type){modal='meal';const choices=state.recipes.map(r=>`<option value="${esc(r.id)}" ${id===r.id?'selected':''}>${esc(r.title)}</option>`).join('');showModal(topModal('Mahlzeit einplanen','Rezept auswählen und Portionszahl bestimmen.')+`<div class="field"><label>Rezept</label><select id="mealRecipe">${choices}</select></div><div class="formrow"><div class="field"><label>Mahlzeit</label><select id="mealType">${['Frühstück','Mittagessen','Abendessen','Snack'].map(t=>`<option ${type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Portionen</label><input type="number" id="mealPortions" min="0.1" max="99" step="0.25" value="1" /></div></div><div class="field"><label>Tag</label><input type="date" id="mealDate" value="${esc(planDate)}" /></div><div class="modalactions"><button class="btn" data-action="close">Abbrechen</button><button class="btn primary" data-action="saveMeal">Eintragen</button></div>`)}
function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function validateRecipe(r){return r&&typeof r.id==='string'&&typeof r.title==='string'&&Array.isArray(r.ingredients)&&r.ingredients.length<=100&&r.ingredients.every(i=>typeof i.name==='string'&&i.name.length<250&&Number.isFinite(Number(i.grams))&&Number(i.grams)>=0&&(i.values==null||(['kcal','p','c','f','fi'].every(k=>Number.isFinite(Number(i.values[k]))&&Number(i.values[k])>=0))))}
function handleJSON(data){const arr=Array.isArray(data)?data:Array.isArray(data.recipes)?data.recipes:null;if(!arr||!arr.every(validateRecipe)||arr.length>10000)throw Error('Keine gültige MealPilot-Rezeptsammlung.');const existing=new Map(state.recipes.map(r=>[r.id,r]));arr.forEach(r=>{if(!existing.has(r.id))existing.set(r.id,r);else if(JSON.stringify(existing.get(r.id))!==JSON.stringify(r))existing.set(cryptoId(),{...r,id:cryptoId()})});state.recipes=[...existing.values()];if(data&&Array.isArray(data.meals)&&data.meals.length<=20000){state.meals=[...state.meals,...data.meals.filter(m=>m&&typeof m.date==='string'&&validateRecipe(m.snapshot)).map(m=>({...m,id:cryptoId()}))]}if(Number.isFinite(Number(data.target))&&Number(data.target)>=800&&Number(data.target)<=6000)state.target=Number(data.target);persist();render();toast(`${arr.length} Rezepte eingelesen.`)}
async function loadJSON(file){if(!file)return;try{const str=await file.text();if(str.length>7e6)throw Error('Datei zu groß');handleJSON(JSON.parse(str))}catch(e){toast('Import fehlgeschlagen: '+e.message)}}
function process(){const link=document.getElementById('importLink')?.value.trim()||'',caption=document.getElementById('importText')?.value.trim()||'';if(link&&!safeUrl(link)){toast('Bitte einen gültigen https-Link verwenden.');return}if(!link&&!caption){toast('Bitte einen Link oder Rezepttext einfügen.');return}importLink='';importText='';let firstLine=caption.split('\n').find(t=>t.trim()&&!/^\s*\d+/.test(t))||'';let title=firstLine.length>6&&firstLine.length<80?firstLine.replace(/^rezept\s*[:\-]\s*/i,''):'';const fromLink=link.match(/https?:\/\/[^\/]+\/(.*)/);editDraft={id:cryptoId(),title:title||'Neues Rezept aus Link',category:'Mittagessen',emoji:'',servings:1,source:link,notes:'Importierter Originaltext:\n'+caption,steps:'',ingredients:parseText(caption)};if(editDraft.ingredients.length===0)editDraft.ingredients=[ingredient('Unbekannte Zutat',0)];editId=null;editorModal();toast('Rezepttext übernommen – bitte Zutaten und Mengen kontrollieren.')}
const IMPORT_API='https://mealpilot-video-import.onrender.com/api/import';
function showGeminiRecipe(response,link){
 const r=response.recipe||{};
 const warnings=[...(response.warnings||[]),...(r.missing_information||[]).map(s=>'Fehlende Angabe: '+s)];
 const ingredientNotes=(r.ingredients||[]).filter(i=>i.uncertain||!Number(i.grams)).map(i=>i.name+': '+(i.quantity_text||'Menge unbekannt')).slice(0,35);
 editDraft={id:cryptoId(),title:String(r.title||'TikTok-Rezept').slice(0,140),category:r.category||'Sonstiges',emoji:'',servings:Number(r.servings)||1,source:link,steps:r.steps||'',thumbnail:safeImage(response.thumbnail),
   notes:[r.notes||'',...(warnings.length?['Prüfhinweise: '+warnings.join(' | ')]:[]),...(ingredientNotes.length?['Originalmengen: '+ingredientNotes.join(' | ')]:[])].filter(Boolean).join('\n'),
   ingredients:(r.ingredients||[]).map(i=>ingredient(i.name,Number(i.grams)||0))};
 if(!editDraft.ingredients.length)editDraft.ingredients=[ingredient('Unbekannte Zutat',0)];
 importLink='';importText='';editId=null;modal='preview';importPreview(response);
}
function importPreview(response){
 const r=editDraft;
 const method={caption:'Aus der Videobeschreibung',website:'Von der Rezeptwebsite',description_ai:'Beschreibung mit KI strukturiert',video:'Aus dem Video erkannt'}[response.extraction_method]||'Rezept importiert';
 const issues=(response.warnings||[]).filter(Boolean);
 showModal(topModal('Rezept erkannt','Du kannst die Angaben prüfen und anschließend speichern.')+
 `<div class="recipe-preview"><div class="preview-hero">${recipeArt(r)}</div><span class="chip">${esc(r.category)} · ${esc(method)}</span>
 <h2 class="preview-title">${esc(r.title)}</h2>
 ${nutritionPreview(r)}
 <div class="preview-section">Zutaten <span class="preview-sub">· ${r.servings} Portion(en)</span></div>
 <ul class="preview-list">${(response.recipe?.ingredients||[]).map(i=>`<li><span>${esc(i.name)}</span><span class="amount">${esc(i.quantity_text||((i.grams||0)+' g'))}${(!i.grams||i.uncertain)?' ⚠':''}</span></li>`).join('')}</ul>
 <div class="preview-section">Zubereitung</div><div class="steps">${esc(r.steps||'Keine vollständige Anleitung erkannt. Ergänze sie über „Bearbeiten“.')}</div>
 ${issues.length?`<div class="preview-warning">⚠ ${esc(issues.join(' · '))}</div>`:''}
 <div class="preview-actions"><button class="btn light" data-action="editImport">Bearbeiten</button><button class="btn primary" data-action="confirmImport">Im Rezeptbuch speichern</button></div>
 <p class="import-note">Nährwerte sind Näherungswerte. Fehlende Zutaten und Grammangaben bitte vor dem Kochen und Planen ergänzen.</p></div>`);
}
function safeImage(u){try{const x=new URL(u);return x.protocol==='https:'&&x.hostname&&!x.username&&!x.password?x.href:''}catch(e){return ''}}
function recipeArt(r){const img=safeImage(r.thumbnail);return img?`<img src="${esc(img)}" alt="${esc(r.title)}" loading="lazy" referrerpolicy="no-referrer">`:foodIcon(r)}
async function analyzeVideo(){
 const link=document.getElementById('importLink')?.value.trim()||'';
 const status=document.getElementById('importStatus');
 const btn=document.querySelector('[data-action="analyzeVideo"]');
 if(!link||!safeUrl(link)){if(status)status.textContent='Bitte einen gültigen TikTok-HTTPS-Link einfügen.';return}
 try{const u=new URL(link);if(!['tiktok.com','www.tiktok.com','m.tiktok.com','vm.tiktok.com','vt.tiktok.com'].includes(u.hostname)){if(status)status.textContent='Der automatische Videoimport unterstützt zunächst TikTok.';return}}catch(e){return}
 if(btn)btn.disabled=true;
 if(status)status.textContent='⏳ Wir prüfen die Beschreibung und ggf. die Rezeptwebsite. Nur falls nötig folgt die Videoanalyse. Das kann etwas dauern.';
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),240000);
 try{
  const res=await fetch(IMPORT_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:link}),signal:controller.signal});
  const payload=await res.json().catch(()=>({error:'Der Server hat keine gültige Antwort geschickt.'}));
  if(!res.ok)throw new Error(payload.error||('HTTP '+res.status));
  if(modal!=='import')return;
  showGeminiRecipe(payload,link);
 }catch(e){if(status&&status.isConnected){status.textContent='⚠ Import nicht möglich: '+(e.name==='AbortError'?'Zeitüberschreitung beim Import.':e.message);showImportFallback()}}
 finally{clearTimeout(timer);if(btn&&btn.isConnected)btn.disabled=false}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
 if(a==='closeBackdrop'){if(e.target===b)closeModal();return}if(a==='navigate'){closeModal();view=b.dataset.view;render();scrollTo({top:0,behavior:'instant'});return}if(a==='close'){closeModal();return}if(a==='filter'){category=b.dataset.category;render();return}if(a==='import'){importModal();return}if(a==='new'){beginEditor(null);return}if(a==='processImport'){process();return}if(a==='analyzeVideo'){analyzeVideo();return}if(a==='editImport'){modal='edit';editorModal();return}if(a==='confirmImport'){if(!editDraft)return;state.recipes.push(copy(editDraft));persist();closeModal();view='recipes';render();toast('Rezept im Kochbuch gespeichert!');return}if(a==='addIngredient'){grabEditor();editDraft.ingredients.push(ingredient('',0));editorModal();return}if(a==='removeIngredient'){grabEditor();editDraft.ingredients.splice(Number(b.dataset.index),1);if(!editDraft.ingredients.length)editDraft.ingredients.push(ingredient('',0));editorModal();return}if(a==='saveRecipe'){grabEditor();if(!editDraft.title){toast('Bitte einen Rezeptnamen eingeben.');return}if(!Number.isFinite(editDraft.servings)||editDraft.servings<1||editDraft.servings>99){toast('Portionszahl prüfen.');return}if(editDraft.ingredients.some(i=>!i.name||i.grams<=0)){toast('Bitte alle Zutaten und Grammangaben ergänzen.');return}if(editDraft.source&&!safeUrl(editDraft.source)){toast('Rezeptlink muss eine gültige http(s)-Adresse sein.');return}if(editId){const ix=state.recipes.findIndex(x=>x.id===editId);if(ix>=0)state.recipes[ix]=copy(editDraft)}else state.recipes.push(copy(editDraft));persist();closeModal();view='recipes';render();toast('Rezept gespeichert!');return}if(a==='detail'){detail(id);return}if(a==='editRecipe'){const r=state.recipes.find(r=>r.id===id);if(r)beginEditor(r);return}if(a==='deleteRecipe'){if(confirm('Dieses Rezept wirklich löschen? Bereits geplante Mahlzeiten bleiben erhalten.')){state.recipes=state.recipes.filter(r=>r.id!==id);persist();closeModal();render();toast('Rezept gelöscht.')}return}if(a==='addMeal'){if(!state.recipes.length){toast('Bitte zuerst ein Rezept erstellen.');return}addMealModal(id||state.recipes[0].id,b.dataset.type||'Mittagessen');return}if(a==='saveMeal'){const rid=document.getElementById('mealRecipe').value,recipe=state.recipes.find(r=>r.id===rid),portions=Number(document.getElementById('mealPortions').value),date=document.getElementById('mealDate').value;if(!recipe||!date||!(portions>=.1&&portions<=99)){toast('Bitte Portionen und Datum prüfen.');return}state.meals.push({id:cryptoId(),date,type:document.getElementById('mealType').value,portions,snapshot:copy(recipe)});planDate=date;persist();closeModal();view='plan';render();toast('Mahlzeit eingeplant!');return}if(a==='removeMeal'){state.meals=state.meals.filter(m=>m.id!==id);persist();render();return}if(a==='saveTarget'){const v=Number(document.getElementById('target').value);if(v<800||v>6000){toast('Bitte einen Wert zwischen 800 und 6000 eingeben.');return}state.target=v;persist();render();toast('Kalorienziel gespeichert.');return}if(a==='export'){download('mealpilot-backup-'+today()+'.json',{version:1,...state});toast('Sicherung heruntergeladen.');return}if(a==='exportSingle'){const r=state.recipes.find(r=>r.id===id);if(r)download('mealpilot-'+r.title.toLowerCase().replace(/[^a-z0-9äöü]+/g,'-')+'.json',[r]);return}if(a==='importFile'){let f=document.getElementById('fileInput');if(!f){view='settings';render();f=document.getElementById('fileInput')}f.click();return}
});
document.addEventListener('change',e=>{if(e.target.id==='fileInput'){loadJSON(e.target.files[0]);e.target.value=''}});
document.addEventListener('input',e=>{if(modal==='edit'&&(e.target.matches('[data-ingname]')||e.target.matches('[data-inggrams]')||e.target.id==='rServings')){grabEditor();const p=document.getElementById('nutrition-preview');if(p)p.innerHTML=nutritionPreview(editDraft)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
render();
const shared=new URLSearchParams(location.search);
const shareText=[shared.get('url'),shared.get('text')].filter(Boolean).join(' ');
const sharedUrl=shareText.match(/https:\/\/[^\s]+/i)?.[0];
if(sharedUrl){history.replaceState(null,'',location.pathname);importLink=sharedUrl;importModal();}
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
</script>
